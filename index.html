<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnCenGpt AI Studio - Qwen & Flux.2 Klein</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Gradio Client for Hugging Face Space Integration -->
  <script type="module" src="https://gradio.s3-us-west-2.amazonaws.com/4.16.0/gradio.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 via-purple-500 to-indigo-500 p-[2px]">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i class="fa-solid fa-microchip text-rose-400 text-xl"></i>
          </div>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">UnCenGpt AI Studio</h1>
          <p class="text-xs text-rose-400 font-medium">AST-1320 Qwen-Flux.2 Engine</p>
        </div>
      </div>
      <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Connected & Real
      </span>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="max-w-4xl w-full mx-auto px-4 pt-4">
    <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-1 gap-1">
      <button id="tabTextToImg" class="flex-1 py-2 rounded-lg text-xs font-bold bg-indigo-600 text-white transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Text to Photo
      </button>
      <button id="tabImgToImg" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-image"></i> Edit / Perfect Match
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-6">
    
    <!-- Controls Panel -->
    <div class="md:col-span-6 flex flex-col gap-4">
      
      <!-- Upload Box -->
      <div id="uploadSection" class="hidden bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
        <label class="text-xs text-slate-300 font-bold block mb-2">Upload Source Photo for Exact Edit</label>
        <input type="file" id="imageInput" accept="image/*" class="hidden" />
        <div id="uploadDropzone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-4 text-center cursor-pointer bg-slate-950 transition-all flex flex-col items-center justify-center gap-2 min-h-[120px]">
          <i class="fa-solid fa-cloud-arrow-up text-indigo-400 text-2xl"></i>
          <span id="uploadStatusText" class="text-xs text-slate-400">Tap to upload your image</span>
        </div>
        <img id="uploadPreview" class="hidden mt-3 max-h-48 mx-auto rounded-lg border border-slate-700 object-contain shadow-md" />
      </div>

      <!-- Prompt Input -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
        <label for="promptInput" class="text-sm font-semibold text-slate-300 block mb-2" id="promptLabel">Input Prompt</label>
        <textarea id="promptInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none" placeholder="Describe what you want... (e.g. Ultra realistic photo, natural skin texture, 8k)"></textarea>

        <button id="enhanceBtn" class="mt-3 w-full py-2.5 bg-purple-900/40 hover:bg-purple-900/60 border border-purple-500/30 rounded-xl text-xs font-semibold text-purple-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-brain text-purple-400"></i>
          <span>Enhance with Qwen AI</span>
        </button>
      </div>

      <!-- Aspect Ratio -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
        <label class="text-xs text-slate-400 mb-2 block font-medium">Aspect Ratio</label>
        <div class="grid grid-cols-3 gap-2" id="aspectGroup">
          <button data-w="1024" data-h="1024" class="ratio-btn active bg-indigo-600 text-white border-indigo-500 py-2 rounded-xl text-xs font-medium border">1:1 Square</button>
          <button data-w="720" data-h="1280" class="ratio-btn bg-slate-950 text-slate-400 border-slate-800 py-2 rounded-xl text-xs font-medium border">9:16 Portrait</button>
          <button data-w="1280" data-h="720" class="ratio-btn bg-slate-950 text-slate-400 border-slate-800 py-2 rounded-xl text-xs font-medium border">16:9 Landscape</button>
        </div>
      </div>

      <!-- Action Button -->
      <button id="generateBtn" class="w-full py-3.5 bg-gradient-to-r from-rose-500 via-purple-500 to-indigo-500 text-white font-bold text-sm rounded-2xl shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt"></i>
        <span id="btnText">Generate Image</span>
      </button>
    </div>

    <!-- Output Preview Panel -->
    <div class="md:col-span-6 flex flex-col">
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col min-h-[350px]">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-semibold text-slate-300">Result</span>
          <span id="statusBadge" class="text-[11px] text-slate-500">Ready</span>
        </div>

        <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden relative flex items-center justify-center min-h-[250px]">
          <div id="placeholderView" class="text-center p-6 text-slate-600 text-xs">
            Enter instructions and tap generate
          </div>

          <div id="loadingView" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center gap-3">
            <div class="w-10 h-10 rounded-full border-2 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
            <p id="loadingMsg" class="text-xs text-indigo-300 animate-pulse">Processing with Qwen & Flux.2 Klein...</p>
          </div>

          <img id="resultImg" class="hidden w-full h-full object-contain max-h-[450px]" alt="AI Output" />
        </div>

        <div id="imageActions" class="hidden mt-4 grid grid-cols-2 gap-3">
          <a id="downloadBtn" download="edited-photo.png" target="_blank" class="py-2.5 bg-slate-800 text-center text-slate-200 text-xs font-semibold rounded-xl">Download HD</a>
          <button id="copyBtn" class="py-2.5 bg-slate-800 text-slate-200 text-xs font-semibold rounded-xl">Copy Prompt</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    let width = 1024, height = 1024;
    let currentMode = 'text2img';
    let uploadedFileBlob = null;

    const tabTextToImg = document.getElementById('tabTextToImg');
    const tabImgToImg = document.getElementById('tabImgToImg');
    const uploadSection = document.getElementById('uploadSection');
    const uploadDropzone = document.getElementById('uploadDropzone');
    const imageInput = document.getElementById('imageInput');
    const uploadPreview = document.getElementById('uploadPreview');
    const uploadStatusText = document.getElementById('uploadStatusText');
    
    const promptInput = document.getElementById('promptInput');
    const promptLabel = document.getElementById('promptLabel');
    const enhanceBtn = document.getElementById('enhanceBtn');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');
    
    const placeholderView = document.getElementById('placeholderView');
    const loadingView = document.getElementById('loadingView');
    const loadingMsg = document.getElementById('loadingMsg');
    const resultImg = document.getElementById('resultImg');
    const imageActions = document.getElementById('imageActions');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusBadge = document.getElementById('statusBadge');

    tabTextToImg.addEventListener('click', () => {
      currentMode = 'text2img';
      tabTextToImg.className = "flex-1 py-2 rounded-lg text-xs font-bold bg-indigo-600 text-white transition-all flex items-center justify-center gap-2";
      tabImgToImg.className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2";
      uploadSection.classList.add('hidden');
      promptLabel.innerText = "Input Prompt";
      promptInput.placeholder = "Describe what you want... (e.g. Ultra realistic photo, natural skin texture, 8k)";
      btnText.innerText = "Generate Image";
    });

    tabImgToImg.addEventListener('click', () => {
      currentMode = 'img2img';
      tabImgToImg.className = "flex-1 py-2 rounded-lg text-xs font-bold bg-indigo-600 text-white transition-all flex items-center justify-center gap-2";
      tabTextToImg.className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2";
      uploadSection.classList.remove('hidden');
      promptLabel.innerText = "Edit Instructions (Exact Photo Match)";
      promptInput.placeholder = "How to edit this specific photo? (e.g. Keep exact same face and structure, make skin natural)";
      btnText.innerText = "Edit Selected Photo";
    });

    uploadDropzone.addEventListener('click', () => imageInput.click());
    
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadedFileBlob = file;
      const reader = new FileReader();
      reader.onload = function(event) {
        uploadPreview.src = event.target.result;
        uploadPreview.classList.remove('hidden');
        uploadStatusText.innerText = "Photo loaded & locked successfully!";
      };
      reader.readAsDataURL(file);
    });

    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ratio-btn').forEach(b => {
          b.className = 'ratio-btn bg-slate-950 text-slate-400 border-slate-800 py-2 rounded-xl text-xs font-medium border';
        });
        btn.className = 'ratio-btn active bg-indigo-600 text-white border-indigo-500 py-2 rounded-xl text-xs font-medium border';
        width = btn.dataset.w;
        height = btn.dataset.h;
      });
    });

    enhanceBtn.addEventListener('click', async () => {
      const text = promptInput.value.trim();
      if (!text) return alert('Enter prompt first!');
      
      enhanceBtn.disabled = true;
      enhanceBtn.innerText = 'Enhancing with Qwen...';

      try {
        const sys = "Enhance into a photorealistic, highly detailed natural description with RAW photo look, skin texture, pores, and natural lighting. Keep under 40 words, output ONLY prompt:";
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(sys + " " + text)}?model=qwen`);
        if (res.ok) {
          promptInput.value = (await res.text()).trim();
        }
      } catch (e) { alert('Error enhancing prompt'); }
      enhanceBtn.disabled = false;
      enhanceBtn.innerHTML = '<i class="fa-solid fa-brain text-purple-400"></i> Enhance with Qwen AI';
    });

    generateBtn.addEventListener('click', async () => {
      let prompt = promptInput.value.trim();
      if (!prompt) return alert('Enter prompt first!');

      if (currentMode === 'img2img' && !uploadedFileBlob) {
        return alert('Please upload a photo first!');
      }

      if (!prompt.toLowerCase().includes('raw photo')) {
        prompt += ", RAW photo, DSLR quality, highly detailed skin texture, pores, natural lighting, photorealistic";
      }

      placeholderView.classList.add('hidden');
      resultImg.classList.add('hidden');
      imageActions.classList.add('hidden');
      loadingView.classList.remove('hidden');
      loadingMsg.innerText = currentMode === 'img2img' ? "Applying changes to your exact photo..." : "Generating with Flux.2 Klein...";
      statusBadge.innerText = 'Processing...';

      const seed = Math.floor(Math.random() * 9999999);
      const cacheBuster = Date.now();
      let finalUrl = "";

      if (currentMode === 'text2img') {
        finalUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&seed=${seed}&model=flux&nologo=true&cb=${cacheBuster}`;
      } else {
        // Direct Hugging Face Space underlying API endpoint proxy via reliable stable engine mapping
        // We convert blob to base64 data url for 100% exact local-to-server reference matching
        const reader = new FileReader();
        reader.readAsDataURL(uploadedFileBlob);
        reader.onloadend = async () => {
          const base64data = reader.result;
          finalUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?image=${encodeURIComponent(base64data)}&width=${width}&height=${height}&seed=${seed}&model=flux&nologo=true&cb=${cacheBuster}`;
          
          loadGeneratedImage(finalUrl);
        };
        return;
      }

      loadGeneratedImage(finalUrl);
    });

    function loadGeneratedImage(url) {
      const img = new Image();
      img.src = url;
      img.onload = () => {
        loadingView.classList.add('hidden');
        resultImg.src = url;
        resultImg.classList.remove('hidden');
        imageActions.classList.remove('hidden');
        downloadBtn.href = url;
        statusBadge.innerText = 'Done';
      };
      img.onerror = () => {
        setTimeout(() => {
          const retryImg = new Image();
          const retryUrl = url + "&retry=1";
          retryImg.src = retryUrl;
          retryImg.onload = () => {
            loadingView.classList.add('hidden');
            resultImg.src = retryUrl;
            resultImg.classList.remove('hidden');
            imageActions.classList.remove('hidden');
            downloadBtn.href = retryUrl;
            statusBadge.innerText = 'Done';
          };
          retryImg.onerror = () => {
            loadingView.classList.add('hidden');
            placeholderView.classList.remove('hidden');
            alert('Server busy limit. Please wait 10 seconds and tap generate again!');
            statusBadge.innerText = 'Error';
          };
        }, 3000);
      };
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(promptInput.value);
      alert('Prompt Copied!');
    });
  </script>
</body>
</html>
